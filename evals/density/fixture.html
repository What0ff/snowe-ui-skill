<script>
const p=new URLSearchParams(location.search),v=p.get('v')||'after',state=p.get('state')||'empty';document.body.dataset.v=v;document.body.dataset.state=state;
if(v==='after') {
  const header=document.querySelector('.detail-head'), title=document.querySelector('#selected'), holder=document.querySelector('.holder');
  const group=document.createElement('div');group.className='summary-body';header.insertBefore(group,title);group.append(title,holder);
}
const titleMarks={Justice:'<path d="M12 3v18M7 21h10M4 7h16M6 7l-3 7h6L6 7Zm12 0-3 7h6l-3-7ZM3 14c0 4 6 4 6 0m6 0c0 4 6 4 6 0"/>',Duke:'<path d="M4 21V5h4v4h3V5h2v4h3V5h4v16H4Zm6 0v-5a2 2 0 0 1 4 0v5"/>',Architect:'<path d="M4 4h16v16H4zM8 4v8h12M4 16h8v4M12 12v4"/>',Scientist:'<path d="M9 3h6M10 3v6l-5 9c-1 2 0 3 2 3h10c2 0 3-1 2-3l-5-9V3M8 15h8"/>'};
const n=state==='populated'?24:state==='sparse'?2:0;
document.querySelector('.picker').innerHTML=['Justice','Duke','Architect','Scientist'].map((name,i)=>`<button class="choice" aria-pressed="${!i}"><svg class="title-mark" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${titleMarks[name]}</svg><div class="choice-copy"><strong>${name}</strong><small>${n?'Governor One':'Not assigned'}</small></div><span class="count"><span>${n}</span><small>waiting</small></span></button>`).join('');
document.querySelector('#holder').textContent=n?'Governor One':'Not assigned';document.querySelector('#total').textContent=`${n} queued`;
document.querySelector('.queue').innerHTML=n?Array.from({length:n},(_,i)=>`<div class="entry"><strong>Player ${i+1}</strong><code>ID ${1000+i}</code></div>`).join(''):'<p class="empty"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h8M3 6h.01M3 12h.01M3 18h.01"/></svg><span>No players in queue</span></p>';
document.querySelectorAll('.choice').forEach(button=>button.onclick=()=>{document.querySelectorAll('.choice').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.querySelector('#selected').textContent=button.querySelector('strong').textContent});
