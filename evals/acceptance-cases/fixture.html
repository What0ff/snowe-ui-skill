<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snowe acceptance cases</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f1ec;color:#172528;font:16px/1.5 system-ui,sans-serif}main{max-width:880px;margin:auto;padding:24px}h1{font:600 34px/1.15 Georgia,serif;margin:12px 0 20px}h2{font-size:18px;margin:0}p{margin:8px 0 20px;color:#4b5f65}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,[tabindex]:focus-visible{outline:3px solid #185ece;outline-offset:3px}.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase}.panel{border:1px solid #98a8a8;border-radius:12px;background:white;padding:20px}.row{display:flex;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid #d3dcdc}.row:last-child{border-bottom:0}.row>div{min-width:0;flex:1}.row p{margin:4px 0;font-size:14px}.row button,.primary{border:0;border-radius:7px;padding:10px 16px;background:#194f50;color:white}.row button{flex-shrink:0}.mark{display:inline-grid;place-items:center;flex-shrink:0;width:24px;height:24px;color:#195657}.mark svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.toolbar{display:flex;gap:10px;align-items:center;margin:16px 0}.filter{border-radius:999px;padding:8px 15px;border:1px solid #195657;background:#d2e6de}.round{border-radius:50%;width:42px;height:42px;display:grid;place-items:center;border:1px solid #809a97;background:white}.mono{font-family:ui-monospace,monospace;background:#e2e9e5;padding:4px 8px}.bounded{height:440px;max-height:calc(100dvh - 200px);display:flex;flex-direction:column;min-height:0;padding:0}.panel-head,.panel-foot{padding:16px 20px;flex:none}.panel-head{border-bottom:1px solid #c7d4d1}.panel-foot{display:flex;justify-content:center;border-top:1px solid #c7d4d1}.list{min-height:0;flex:1;overflow:auto;padding:0 20px;overscroll-behavior:contain}.list .row{align-items:flex-start}.list strong{overflow-wrap:anywhere}.list code{font-size:12px;white-space:nowrap}.context{margin-top:18px;font-size:12px}body[data-case=typography][data-version=before] .row:nth-child(2){font-family:Georgia,serif}body[data-case=typography][data-version=before] .row:nth-child(3) button{font-family:monospace}body[data-case=backings][data-version=before] .mark,body[data-case=resume][data-version=before] .mark{width:48px;height:48px;border-radius:50%;background:#dacbf0;box-shadow:0 0 0 4px #dacbf055}body[data-case=workspace][data-version=before] .bounded{height:auto;max-height:none}body[data-case=workspace][data-version=before] .list{flex:none;overflow:visible}body[data-case=workspace][data-version=before] .panel-foot .primary{transform:translateX(30px)}@media(max-width:600px){main{padding:18px}.row{gap:10px}.row button{padding:8px 10px}h1{font-size:30px}}
</style>
<main><div class="eyebrow" id="brand"></div><h1 id="heading"></h1><p id="intro"></p><div id="surface"></div><p class="context">Fictional acceptance fixture. Results concern the inspected scope.</p></main>
<script>
const query=new URLSearchParams(location.search);const key=query.get('case')||'coherent';const version=query.get('v')||'after';document.body.dataset.case=key;document.body.dataset.version=version;
const symbols={route:'<path d="M6 5h9a3 3 0 0 1 0 6H9a3 3 0 0 0 0 6h8"/><circle cx="4" cy="5" r="2"/><circle cx="19" cy="17" r="2"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/>',pin:'<path d="M18 9c0 5-6 11-6 11S6 14 6 9a6 6 0 1 1 12 0Z"/><circle cx="12" cy="9" r="2"/>',schedule:'<path d="M4 6h16v15H4zM8 3v6M16 3v6M4 11h16"/>',settings:'<path d="M4 7h16M4 17h16M8 4v6M16 14v6"/>'};
const icon=name=>`<span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24">${symbols[name]}</svg></span>`;
const row=(name,detail,symbol='schedule')=>`<div class="row">${icon(symbol)}<div><h2>${name}</h2><p>${detail}</p></div><button type="button">Open</button></div>`;
const cases={coherent:['Northfield / Editorial','One issue, clear roles','Keep the accepted display face, reading face and identifier role.'],typography:['Fieldnote / Plans','Tools for your team','Compare connected services and choose where to work.'],custom:['Waypoint / Operations','Find the route you need','History opens completed journeys; it does not download a file.'],backings:['Harbor / Services','Your connected services','Passive symbols identify services. Rounded controls remain part of the accepted system.'],workspace:['Dispatch / Workspace','Review pending deliveries','Keep this work area bounded while reviewing a long list.'],resume:['Harbor / Continuation','The next service added','Preserve the earlier correction when extending the same service list.']};
const config=cases[key]||cases.coherent;document.querySelector('#brand').textContent=config[0];document.querySelector('#heading').textContent=config[1];document.querySelector('#intro').textContent=config[2];
let content='';
if(key==='coherent')content='<section class="panel"><h2>Tuesday briefing</h2><p>The afternoon edition covers local transport and the people maintaining it. Headings and reading text have different jobs.</p><span class="mono">ISSUE-042</span></section>';
else if(key==='custom')content='<section class="panel">'+row('Route history','Completed journeys and their stops',version==='before'?'download':'route')+row('Current location','Last reported position','pin')+'</section>';
else if(key==='workspace')content='<section class="panel bounded" aria-label="Pending deliveries"><header class="panel-head"><h2>Pending deliveries</h2><span>80 items</span></header><div class="list" tabindex="0" role="region" aria-label="Scrollable delivery list">'+Array.from({length:80},(_,i)=>`<div class="row"><div><strong lang="${i%2?'ar':'de'}" dir="auto">${i%2?'تسليم الطلب إلى المستودع':'Fahrradgrößeneinstellung und Lieferinformationen'}</strong><p>Delivery window ${9+i%8}:00</p></div><code>REF-${i+1}</code></div>`).join('')+'</div><footer class="panel-foot"><button class="primary" type="button">Review selected</button></footer></section>';
else content='<div class="toolbar"><button class="filter" aria-pressed="true">Connected</button><button class="round" aria-label="Settings">'+icon('settings')+'</button></div><section class="panel">'+row('Schedule','Coverage and upcoming shifts')+row('Route history','Completed journeys and stops','route')+row('Team locations','Current positions','pin')+'</section>';
document.querySelector('#surface').innerHTML=content;
if(key==='workspace' && ['empty','loading'].includes(query.get('state')))document.querySelector('.list').innerHTML=query.get('state')==='empty'?'<p role="status">No pending deliveries.</p>':'<p role="status">Loading deliveries…</p>';
document.querySelectorAll('.filter').forEach(button=>button.onclick=()=>button.setAttribute('aria-pressed',String(button.getAttribute('aria-pressed')!=='true')));
window.__acceptanceReady=true;
</script></html>
