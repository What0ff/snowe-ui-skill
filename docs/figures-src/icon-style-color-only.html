<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="figure" content="icon-style-color-only.png 390x304@2">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self' 'unsafe-inline'; img-src data:">
<title>Selected tab marked by color only</title>
<link rel="stylesheet" href="icon-style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="home" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.2 12 3.5l8.5 6.7V19a1.5 1.5 0 0 1-1.5 1.5h-4v-6h-6v6H5A1.5 1.5 0 0 1 3.5 19z"/></g></symbol>
<symbol id="search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></g></symbol>
<symbol id="saved-outline" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5h11a1 1 0 0 1 1 1v16l-6.5-4.6-6.5 4.6v-16a1 1 0 0 1 1-1z"/></g></symbol>
<symbol id="saved-solid" viewBox="0 0 24 24"><path fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round" d="M7 4.3h10a.8.8 0 0 1 .8.8v14.9L12 15.9 6.2 20V5.1a.8.8 0 0 1 .8-.8z"/></symbol>
<symbol id="list" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="3.5" width="15" height="17" rx="2"/><path d="M8.5 8.5h7M8.5 12h7M8.5 15.5h4"/></g></symbol>
<symbol id="profile" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c.6-3.8 3.7-6 7.5-6s6.9 2.2 7.5 6"/></g></symbol>
</svg>
<div class="screen">
<div class="content">
<h1>Saved recipes</h1>
<div class="row"><b>Charred leek tart</b><span>50 min</span></div>
<div class="row"><b>Miso butter beans</b><span>25 min</span></div>
</div>
<nav class="tabbar" role="tablist">
<div class="tab" role="tab" aria-selected="false"><svg aria-hidden="true"><use href="#home"/></svg>Home</div>
<div class="tab" role="tab" aria-selected="false"><svg aria-hidden="true"><use href="#search"/></svg>Search</div>
<div class="tab" role="tab" aria-selected="true"><svg aria-hidden="true"><use href="#saved-outline"/></svg>Saved</div>
<div class="tab" role="tab" aria-selected="false"><svg aria-hidden="true"><use href="#list"/></svg>Shopping</div>
<div class="tab" role="tab" aria-selected="false"><svg aria-hidden="true"><use href="#profile"/></svg>Profile</div>
</nav>
</div>
<div class="note">Same tab bar in grayscale</div>
<div class="gray">
<nav class="tabbar" role="tablist">
<div class="tab" role="tab" aria-selected="false"><svg aria-hidden="true"><use href="#home"/></svg>Home</div>
<div class="tab" role="tab" aria-selected="false"><svg aria-hidden="true"><use href="#search"/></svg>Search</div>
<div class="tab" role="tab" aria-selected="true"><svg aria-hidden="true"><use href="#saved-outline"/></svg>Saved</div>
<div class="tab" role="tab" aria-selected="false"><svg aria-hidden="true"><use href="#list"/></svg>Shopping</div>
<div class="tab" role="tab" aria-selected="false"><svg aria-hidden="true"><use href="#profile"/></svg>Profile</div>
</nav>
</div>
</body>
</html>
